server {
    listen 80 default_server;
    server_name _;

    root /var/www/stashbin/public;
    index index.php;

    # The encrypted payload travels through POST /api.php; the server limit
    # must stay above max_size (2 MiB by default in config.php), otherwise
    # nginx returns 413 before PHP ever sees the request.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # try_files avant fastcgi_pass : sans cela, une URL du type
        # /nonexistent.php/x.php would cause another file to be executed.
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Hidden files (.git, .env…): never served.
    location ~ /\. {
        deny all;
    }
}
