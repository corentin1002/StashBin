server {
    listen 80 default_server;
    server_name _;

    root /var/www/stashbin/public;
    index index.php;

    # Le payload chiffré transite par POST /api.php ; la limite serveur doit
    # rester au-dessus de max_size (2 Mio par défaut dans config.php), sinon
    # nginx renvoie 413 avant que PHP ne voie la requête.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # try_files avant fastcgi_pass : sans cela, une URL du type
        # /inexistant.php/x.php ferait exécuter un autre fichier.
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Fichiers cachés (.git, .env…) : jamais servis.
    location ~ /\. {
        deny all;
    }
}
